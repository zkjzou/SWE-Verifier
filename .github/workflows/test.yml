name: Test release package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      MSWEA_SILENT_STARTUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints.txt '.[dev]'
      - run: python -m ruff check src tests examples training
      - run: python -m pytest
      - run: python -m build
      - name: Verify installed wheel resources outside checkout
        run: |
          python -m venv /tmp/release-wheel
          /tmp/release-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/release-wheel/bin/swe-verifier run --list-recipes
          /tmp/release-wheel/bin/swe-verifier run --recipe selective_two_stage --dry-run
          /tmp/release-wheel/bin/swe-verifier data --help
  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest==9.0.2 transformers==5.6.1 tokenizers==0.22.2 accelerate==1.11.0
      - run: python -m pytest training/tests -q
      - run: python -m training.train --recipe two_stage_shared --dry-run
